# The papers the backward sweep starts from, by citation key.
seeds: []

feeds:
  arxiv: []
  eprint_keywords: []
  dblp_venues: []

# The day each sweep last ran. A null value means it has never run.
last_sweep:
  backward: null      # prominence lookup partial, 2026-10-16
  forward: null
  venue: 2026-10-16   # 2023 to 2026, eleven venues, see screening.csv
