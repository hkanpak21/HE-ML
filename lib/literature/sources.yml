# The field, tracked. Every sweep updates last_sweep so the next one knows
# where it started. Venue names use the nine values of .paper-meta.yml.
project: he-ml
updated: 2026-10-16

venues:
  primary: [acm-ccs]
  watch: []

# Research groups worth following, by institution and lead area, never by a
# single person alone.
groups: []

# Individual researchers whose output is tracked.
researchers: []

# The papers the backward sweep starts from, by citation key.
seeds: []

feeds:
  arxiv: []
  eprint_keywords: []
  dblp_venues: []

# The day each sweep last ran. A null value means it has never run.
last_sweep:
  backward: null
  forward: null
  venue: null
